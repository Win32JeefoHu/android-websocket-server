<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Dashboard</title>
    <style>
        body { font-family: sans-serif; margin: 10px; background: #f0f0f0; }
        h2 { color: #333; }
        #log {
            background: white;
            border: 1px solid #ccc;
            height: 70vh;
            overflow-y: auto;
            padding: 10px;
            border-radius: 8px;
        }
        .msg { margin: 4px 0; padding: 6px; background: #e8f5e9; border-radius: 4px; }
        input, button { margin-top: 10px; padding: 8px; font-size: 16px; }
    </style>
</head>
<body>
    <h2>WebSocket Dashboard (localhost:8765)</h2>
    <div id="log"></div>
    <input id="msgInput" type="text" placeholder="Teszt üzenet küldése..." style="width:70%;">
    <button onclick="sendTest()">Küldés</button>

    <script>
        const log = document.getElementById('log');
        const ws = new WebSocket('ws://127.0.0.1:8765');

        function addMsg(text) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        ws.onopen = () => addMsg('Csatlakozva a szerverhez');
        ws.onmessage = (e) => addMsg(e.data);
        ws.onclose = () => addMsg('Kapcsolat lezárva');
        ws.onerror = (e) => addMsg('Hiba: ' + e);

        function sendTest() {
            const input = document.getElementById('msgInput');
            if (ws.readyState === WebSocket.OPEN && input.value) {
                ws.send(input.value);
                input.value = '';
            }
        }
    </script>
</body>
</html>
